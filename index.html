    function openDetail(id){const o=all.find(x=>x.id===id);if(!o)return;document.getElementById('drawer').innerHTML=`<div class="drawer-head"><div><div class="eyebrow">RESEARCH RECORD · ${esc(o.id.toUpperCase())}</div><h2>${esc(o.name)}</h2><p>${esc(o._group)} · ${esc(o._tier)}</p></div><button class="iconbtn" id="closeDrawer" aria-label="Close detail">×</button></div><div class="drawer-body"><div class="detail-kpis"><div class="scorebox">${o._rank.score}<small>RESEARCH<br>PRIORITY</small></div><div class="aside"><strong>${o.category==='Corporate decision-maker'?'No purchasing authority established':'No buying signal established'}</strong>The score indicates how useful this entry may be to investigate, not probability of securing a booking. Source records may be stale.</div></div><div class="detail-title">Underlying published information</div><div class="detail-grid">${detailRows(o)}</div>${o.category==='Corporate watchlist'?`<div class="detail-title">Decision-maker research</div><div class="evidence"><div>Published employee roles are not proof of purchasing authority. Check the current title before approaching.</div>${(o.decisionMakers||[]).map(p=>`<div style="margin-top:13px;padding-top:10px;border-top:1px solid #e5edf0"><strong>${esc(p.name)}</strong><div>${esc(p.title)} · ${esc(p.confidence)}</div><div style="margin-top:6px">${link(p.evidence,'Employer evidence')}${p.linkedin?' · '+link(p.linkedin,'LinkedIn profile'):''}</div><div style="margin-top:4px;color:#748b95">${esc(p.status)}</div></div>`).join('')}${o.linkedinRoleSearch?`<div style="margin-top:14px">${link(o.linkedinRoleSearch,'Search LinkedIn workplace roles')} · ${link(o.officialRoleSearch,'Search employer role pages')}</div>`:''}<div style="margin-top:8px;color:#748b95">Headcount: not verified. Photography buying intent: not established.</div></div>`:''}<div class="detail-title">Potential relationship or signal</div><div class="evidence">${esc(o.approach||'No approach established.')}${o.monitor?`<div style="margin-top:8px;color:#79919d">Monitor: ${esc(o.monitor)}</div>`:''}</div><div class="detail-title">Scoring breakdown</div>${o._rank.breakdown.map(([key,v])=>`<div class="score-factor"><span>${esc(key)}</span><b>+${v}</b></div>`).join('')}<div class="detail-title">Research notes</div><div class="evidence">${esc(o.notes||o.note||'No additional evidence recorded.')}</div><div class="detail-title">Original evidence</div><div style="font-size:12px;word-break:break-all">${link(o.source,'Open source record')}</div><div class="local-note">Research and source reviews are not legal clearance for automated collection or marketing.</div></div><div class="drawer-actions"><button class="btn" id="shortlistToggle">${icon('bookmark',15)} ${shortlist.has(id)?'Remove shortlist':'Add to shortlist'}</button><button class="btn btn-primary" id="sourceOpen" ${!safeUrl(o.source)?'disabled':''}>${icon('arrow',14)} Open evidence</button></div>`;
      document.getElementById('drawer').classList.add('show');document.getElementById('backdrop').classList.add('show');document.getElementById('closeDrawer').onclick=closeDetail;document.getElementById('shortlistToggle').onclick=()=>{if(shortlist.has(id))shortlist.delete(id);else shortlist.add(id);try{localStorage.setItem('searchv1-shortlist',JSON.stringify([...shortlist]))}catch(_e){}openDetail(id);if(['priority','directory','corporate','people','events'].includes(state.page))refreshTable()};const l=document.getElementById('sourceOpen');l.onclick=()=>{if(safeUrl(o.source))window.open(o.source,'_blank','noopener,noreferrer')};}
    function exportCsv(rows){const heads=['Name','Category','Employer','Published role','Research score','Evidence tier','London status','Website','Public email','Phone','LinkedIn','X / Twitter','Instagram','Original source','Notes'];let vals=[heads,...rows.map(o=>[o.name,o._group,o.company,o.role,o._rank.score,o._tier,o.london,o.website,o.email,o.phone,o.linkedin,o.x,o.instagram,o.source,o.notes||o.note])];let csv=vals.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='search-v1-'+state.page+'-research.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
    function render(){if(state.page==='overview')return overview();if(['priority','directory','corporate','victoria','westend','people','events'].includes(state.page))return tablePage();if(state.page==='sources')return sourcesPage();if(state.page==='method')return methodPage()}
    document.addEventListener('click',e=>{let n=e.target.closest('[data-nav]');if(n){navigate(n.dataset.nav);return}let o=e.target.closest('[data-open]');if(o)openDetail(o.dataset.open)});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();if((e.key==='Enter'||e.key===' ')&&e.target.hasAttribute('data-open')){e.preventDefault();openDetail(e.target.dataset.open)}});
    document.getElementById('search-icon').innerHTML=icon('search',15);
    document.getElementById('globalSearch').addEventListener('input',e=>{state.search=e.target.value.trim();state.pageNo=1;if(['overview','sources','method'].includes(state.page)){if(state.search)navigate('priority');else render()}else render()});
    window.closeDetail=()=>{document.getElementById('drawer').classList.remove('show');document.getElementById('backdrop').classList.remove('show')};window.toggleSidebar=()=>document.getElementById('sidebar').classList.toggle('open');
    navRender();render();
  })();
  </script>
</body></html>
